<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>标签模板 70×30mm</title>
<script src="https://fastly.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://fastly.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root{
    --label-w: 70mm;
    --label-h: 30mm;
    --qr-size: 10mm;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }

  body{
    font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
    background: #f2f3f5;
    color: #222;
    padding: 24px;
  }

  /* ===== 控制面板（打印时隐藏） ===== */
  .panel{
    max-width: 70mm;
    margin: 0 auto 24px;
    background: #fff;
    border: 1px solid #e3e5e8;
    border-radius: 10px;
    padding: 16px;
  }
  .panel h1{ font-size: 15px; margin-bottom: 12px; }
  .panel label{
    display: block;
    font-size: 12px;
    color: #555;
    margin: 10px 0 4px;
  }
  .panel input[type="text"]{
    width: 100%;
    padding: 7px 9px;
    font-size: 13px;
    border: 1px solid #cfd3d8;
    border-radius: 6px;
    outline: none;
  }
  .panel input[type="text"]:focus{ border-color: #3b82f6; }
  .panel .row{ display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  .panel .row label{ margin: 0; white-space: nowrap; }
  .panel input[type="range"]{ flex: 1; }
  .panel .size-val{ font-size: 12px; width: 48px; text-align: right; }

  .btn-print{
    margin-top: 16px;
    width: 100%;
    padding: 10px 0;
    font-size: 14px;
    color: #fff;
    background: #2563eb;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-print:hover{ background: #1d4fc0; }
  .tip{ font-size: 11px; color: #888; margin-top: 10px; line-height: 1.6; }

  /* ===== 标签预览 ===== */
  .stage{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: var(--label-h);
  }

  .label{
    width: var(--label-w);
    height: var(--label-h);
    background: #fff;
    border: 1px dashed #b9bec5;
    border-radius: 2mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 2mm 2.5mm;
    gap: 1mm;
  }

  .line{
    font-size: var(--font-size, 9pt);
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .line.right{ text-align: right; }
  .row34{ display: flex; gap: 2mm; }
  .row34 .line{ flex: 1; min-width: 0; }

  /* 通栏一维码 */
  .barcode-box{
    width: 100%;
    height: 8mm;
    display: flex;
    align-items: center;
    margin: 0.5mm 0;
  }
  .barcode-box svg, .barcode-box canvas{ display: block; }
  .barcode-box svg{ height: 8mm !important; width: 100% !important; }

  /* 底部：左文字 右二维码 */
  .bottom{
    flex: 1;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 2mm;
    overflow: hidden;
  }
  .bottom-left{
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .qr-area{
    width: var(--qr-size);
    height: var(--qr-size);
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    flex-shrink: 0;
  }
  .qr-box{
    width: var(--qr-size);
    height: var(--qr-size);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-box canvas, .qr-box img, .qr-box table{ width: 100% !important; height: 100% !important; display: block; border-collapse: collapse; }

  /* ===== 打印 ===== */
  @page{ size: 70mm 30mm landscape; margin: 0; }
  @media print{
    html, body{ margin: 0; padding: 0; }
    body{ background: #fff; }
    .panel{ display: none !important; }
    .stage{ justify-content: flex-start; min-height: 0; }
    .label{ border: none; border-radius: 0; }
  }
</style>
</head>
<body>

  <div class="panel">
    <h1>标签内容编辑（70 × 30 mm）</h1>

    <label>产品代码（生成一维条码）</label>
    <input type="text" id="code1" value="G17986-P0778003701" autocomplete="off">

    <label>映射编码</label>
    <input type="text" id="code2" value="M99W111876" autocomplete="off">

    <label>库位</label>
    <input type="text" id="code3" value="Premium Side Bracket" autocomplete="off">

    <label>入库单号</label>
    <input type="text" id="code5" value="RK-20261118-001" autocomplete="off">

    <label>容器号（生成二维码）</label>
    <input type="text" id="code4" value="M99W111876" autocomplete="off">

    <div class="row">
      <label>统一字号</label>
      <input type="range" id="fontSize" min="7" max="13" step="0.5" value="9">
      <span class="size-val" id="fontSizeVal">9pt</span>
    </div>

    <button class="btn-print" id="btnPrint">打印 / 导出 PDF</button>
    <p class="tip">
      说明：产品代码生成一维条码，映射编码、库位、入库单号正常显示，容器号生成二维码；各行文字字号统一。<br>
      打印步骤：① 点上方按钮；② 在 Chrome 对话框底部点「使用系统对话框进行打印 (Ctrl+Shift+P)」；③ 在系统对话框选 ZD421、纸张 70×30mm、布局横向、边距「无」、缩放默认，再打印。
    </p>
  </div>

  <div class="stage" id="stage">
    <div class="label">
      <div class="line" id="show1"></div>
      <div class="barcode-box"><svg id="barcode"></svg></div>
      <div class="bottom">
        <div class="bottom-left">
          <div class="line" id="show2"></div>
          <div class="line" id="show5"></div>
          <div class="row34">
            <div class="line" id="show3"></div>
            <div class="line right" id="show4"></div>
          </div>
        </div>
        <div class="qr-area">
          <div class="qr-box" id="qrBox"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  const code1 = $('code1'), code2 = $('code2'), code3 = $('code3'), code4 = $('code4'), code5 = $('code5');
  const show1 = $('show1'), show2 = $('show2'), show3 = $('show3'), show4 = $('show4'), show5 = $('show5');
  const fontSize = $('fontSize'), fontSizeVal = $('fontSizeVal');
  const qrBox = $('qrBox');

  function renderBarcode(text){
    const el = $('barcode');
    el.innerHTML = '';
    const value = (text || '').trim();
    if(!value || typeof JsBarcode === 'undefined') return;
    try{
      JsBarcode(el, value, {
        format: 'CODE128',
        width: 2,
        height: 100,
        displayValue: false,
        margin: 0
      });
      const w = el.width.baseVal.value || parseFloat(el.getAttribute('width')) || 100;
      const h = el.height.baseVal.value || parseFloat(el.getAttribute('height')) || 100;
      el.setAttribute('viewBox', `0 0 ${w} ${h}`);
      el.setAttribute('preserveAspectRatio', 'none');
    }catch(e){ console.error(e); }
  }

  function renderQR(text){
    qrBox.innerHTML = '';
    const value = (text || '').trim();
    if(!value){
      const empty = document.createElement('div');
      empty.style.color = '#bbb';
      empty.style.fontSize = '8pt';
      empty.textContent = '二维码';
      qrBox.appendChild(empty);
      return;
    }
    if(typeof QRCode === 'undefined'){
      const empty = document.createElement('div');
      empty.style.color = '#c0392b';
      empty.style.fontSize = '8pt';
      empty.textContent = '二维码库未加载';
      qrBox.appendChild(empty);
      return;
    }
    try{
      new QRCode(qrBox, {
        text: value,
        width: 200,
        height: 200,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }catch(e){ console.error(e); }
  }

  function update(){
    show1.textContent = code1.value;
    show2.textContent = code2.value;
    show3.textContent = code3.value;
    show4.textContent = code4.value;
    show5.textContent = code5.value;
    document.documentElement.style.setProperty('--font-size', fontSize.value + 'pt');
    fontSizeVal.textContent = fontSize.value + 'pt';
    renderBarcode(code1.value);
    renderQR(code4.value);
  }

  [code1, code2, code3, code4, code5].forEach(el => el.addEventListener('input', update));
  fontSize.addEventListener('input', update);

  $('btnPrint').addEventListener('click', function(){
    try{ window.print(); }
    catch(e){ alert('当前浏览器不支持直接打印，请用 Chrome 或 Edge 打开本文件后再打印。'); }
  });

  update();
</script>
</body>
</html>
